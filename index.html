<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./dist/style.css" rel="stylesheet">
</head>

<body>
    <header class="px-10 py-6 bg-background">
        <nav class="hidden md:flex flex-row justify-between items-center">
            <div class="flex flex-row space-x-4 w-fit items-center">
                <span class="font-semibold text-xl">کوئرا لیست</span>
                <ul class="flex flex-row items-center space-x-16 justify-around px-16">
                    <li>صفخه اصلی</li>
                    <li>درباره ما</li>
                    <li>ارتباط با ما</li>
                </ul>
            </div>
            <div class="flex flex-row w-fit justify-between space-x-4 items-center">
                <button id="signin" class="flex-4 bg-primary text-nowrap  text-neutral-100  rounded-md py-2 px-6">ورود
                    به
                    اپلیکیشن</button>
                <img id="toggle-theme" class="flex-1 max-h-6" src="./assets/icons/toggle-theme.svg" alt="toggle-theme">
            </div>
        </nav>
        <nav class="flex flex-row flex-nowrap justify-between items-center md:hidden">
            <div class="min-w-6 max-w-8">
                <button
                    class="group inline-flex w-12 h-12 text-slate-800 bg-white text-center items-center justify-center rounded transition"
                    aria-pressed="false"
                    onclick="this.setAttribute('aria-pressed', !(this.getAttribute('aria-pressed') === 'true'))">
                    <span class="sr-only">Menu</span>
                    <svg class="w-6 h-6 fill-current pointer-events-none" viewBox="0 0 16 16"
                        xmlns="http://www.w3.org/2000/svg">
                        <rect
                            class="origin-center -translate-y-[5px] translate-x-[7px] transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-[[aria-pressed=true]]:translate-x-0 group-[[aria-pressed=true]]:translate-y-0 group-[[aria-pressed=true]]:rotate-[315deg]"
                            y="7" width="9" height="2" rx="1"></rect>
                        <rect
                            class="origin-center transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.8)] group-[[aria-pressed=true]]:rotate-45"
                            y="7" width="16" height="2" rx="1"></rect>
                        <rect
                            class="origin-center translate-y-[5px] transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-[[aria-pressed=true]]:translate-y-0 group-[[aria-pressed=true]]:rotate-[135deg]"
                            y="7" width="9" height="2" rx="1"></rect>
                    </svg>
                </button>
            </div>
            <span class="font-semibold text-center w-full text-xl">کوئرا لیست</span>
        </nav>
    </header>
</body>

</html>
