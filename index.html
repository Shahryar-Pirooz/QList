<!doctype html>
<html data-theme="dark" lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./dist/style.css" rel="stylesheet">
</head>

<body class="bg-background">
    <header class="px-10 py-6 bg-background z-10 sticky top-0">
        <nav class="hidden lg:flex flex-row justify-between items-center">
            <div class="flex flex-row space-x-4 w-fit items-center">
                <h1 class="font-semibold text-xl">کوئرا لیست</h1>
                <ul class="flex flex-row items-center space-x-16 justify-around px-16">
                    <li>صفخه اصلی</li>
                    <li>درباره ما</li>
                    <li>ارتباط با ما</li>
                </ul>
            </div>
            <div class="flex flex-row w-fit justify-between space-x-4 items-center">
                <button id="signin" class="flex-4 bg-primary text-nowrap  text-neutral-100  rounded-md py-2 px-6">ورود
                    به
                    اپلیکیشن</button>
                <img id="toggle-theme" class="flex-1 max-h-6" src="./assets/icons/toggle-theme.svg" alt="toggle-theme">
            </div>
        </nav>
        <nav class="flex flex-row flex-nowrap justify-between items-center lg:hidden">
            <div class="min-w-6 max-w-8">
                <button
                    class="group inline-flex w-12 h-12 text-text bg-background text-center items-center justify-center rounded transition"
                    aria-pressed="false"
                    onclick="this.setAttribute('aria-pressed', !(this.getAttribute('aria-pressed') === 'true'))">
                    <span class="sr-only">Menu</span>
                    <svg class="w-6 h-6 fill-current pointer-events-none" viewBox="0 0 16 16"
                        xmlns="http://www.w3.org/2000/svg">
                        <rect
                            class="origin-center -translate-y-1.25 translate-x-1.75 transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-pressed:translate-x-0 group-aria-pressed:translate-y-0 group-aria-pressed:rotate-315"
                            y="7" width="9" height="2" rx="1"></rect>
                        <rect
                            class="origin-center transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.8)] group-aria-pressed:rotate-45"
                            y="7" width="16" height="2" rx="1"></rect>
                        <rect
                            class="origin-center translate-y-1.25 transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-pressed:translate-y-0 group-aria-pressed:rotate-135"
                            y="7" width="9" height="2" rx="1"></rect>
                    </svg>
                </button>
            </div>
            <h1 class="font-semibold text-center w-full text-xl">کوئرا لیست</h1>
        </nav>
    </header>
    <main class="mx-auto container overflow-x-hidden">
        <section class="flex flex-col justify-between px-3 space-y-8 bg-linear-to-b from-surface to-background max-h-screen ">
            <div class="relative flex flex-col space-y-3 min-h-40 py-14 justify-center items-center w-full">
                 <svg class="fill-surface opacity-50  absolute -left-36 top-0" height="288" width="288" xmlns="http://www.w3.org/2000/svg">
                     <circle r="140" cx="140" cy="140"/>
                </svg> 
                <svg class="fill-surface opacity-50  absolute -right-36 top-1/2" height="288" width="288" xmlns="http://www.w3.org/2000/svg">
                <circle r="140" cx="140" cy="140"/>
                </svg> 
                <img class="absolute top-2 right-2 animate-pulse lg:top-10 lg:right-1/4" src="/assets/icons/star.svg" alt="star">
                <span class="text-2xl font-tanha lg:text-5xl">تمرکز رو وارد زندگیت کن </span>
                <span class="text-3xl w-ful font-black relative after:content-[' '] after:absolute after:w-32 after:top-12 after:h-8 after:right-1/4 after:left-0 after:bg-contain after:bg-no-repeat after:bg-[url(/assets/icons/line.svg)] lg:text-7xl lg:after:w-full lg:after:top-24 lg:after:bg-center lg:after:right-10">به سمت اهدافت اوج بگیر</span>
                <img class="absolute bottom-2 left-2 animate-pulse lg:bottom-5 lg:left-1/6" src="/assets/icons/star.svg" alt="star">
            </div>
            <span class="mx-auto text-center ">زمان در یک روز برای ما محدود است، اما مهمترین کار این است که چگونه از آن استفاده می‌کنیم. <br>با اپلیکیشن کوییرا لیست، زمان خود را با هدف و برنامه‌ریزی موثر سپری کنید."</span>
            <div class="flex flex-row flex-nowrap w-full space-x-5 lg:w-fit lg:mx-auto">
                <button class="flex-1 cursor-pointer bg-primary text-nowrap  text-neutral-100  rounded-md py-2 px-6">ورود به اپلیکیشن</button>
                <button class="flex-1 cursor-pointer bg-neutral-200 text-nowrap  text-primary  rounded-md py-2 px-6">درباره ما</button>
            </div>
            <div class="mx-auto">
                <img class="block dark:hidden" src="assets/images/app-web-light.png" alt="web app preview">
                <img class="hidden dark:block" src="assets/images/app-web-dark.png" alt="web app preview">
            </div>
        </section>    
        </main>
</body>

</html>
