<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/style.css">
    <title>About Us</title>
</head>
<body>
    <header class="px-10 py-6 bg-background z-10 sticky top-0">
        <nav class="hidden lg:flex flex-row justify-between items-center">
            <div class="flex flex-row space-x-4 w-fit items-center">
                <h1 class="font-semibold text-xl">کوئرا لیست</h1>
                <ul class="flex flex-row items-center space-x-16 justify-around px-16">
                    <li><a href="/index.html">صفخه اصلی</a></li>
                    <li><a class="text-primary" href="/pages/about.html">درباره ما</a></li>
                    <li><a href="/pages/contact.html">ارتباط با ما</a></li>
                </ul>
            </div>
            <div class="flex flex-row w-fit justify-between space-x-4 items-center">
                <button id="signin" class="flex-4 bg-primary text-nowrap  text-neutral-100  rounded-md py-2 px-6">ورود
                    به
                    اپلیکیشن</button>
                <img id="theme_btn" class="cursor-pointer flex-1 max-h-6" src="/assets/icons/toggle-theme.svg" alt="toggle-theme">
            </div>
            <div data-show="false" id="bg_menu" class="absolute z-10 hidden top-0 left-0 backdrop-blur-sm w-screen h-screen">
                <div id="theme_menu"  class="flex-col rounded-lg shadow min-w-60 text-center space-y-8 absolute top-20 left-10 bg-background px-4 py-8">
                <div><span id="theme_light" class="cursor-pointer w-full border-b border-neutral-300 pb-3">حالت روشن</span></div>
                <div><span id="theme_dark" class="cursor-pointer w-full border-b border-neutral-300 pb-3">حالت خاموش</span></div>
                <div><span id="theme_system" class="cursor-pointer w-full ">پیروی از سیستم</span></div>
            </div>
            </div>
        </nav>
        <nav class="flex flex-row flex-nowrap justify-between items-center lg:hidden">
            <div class="min-w-6 max-w-8">
                <button
                    class="group inline-flex w-12 h-12 text-text bg-background text-center items-center justify-center rounded transition"
                    aria-pressed="false"
                    onclick="this.setAttribute('aria-pressed', !(this.getAttribute('aria-pressed') === 'true'))">
                    <span class="sr-only">Menu</span>
                    <svg class="w-6 h-6 fill-current pointer-events-none" viewBox="0 0 16 16"
                        xmlns="http://www.w3.org/2000/svg">
                        <rect
                            class="origin-center -translate-y-1.25 translate-x-1.75 transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-pressed:translate-x-0 group-aria-pressed:translate-y-0 group-aria-pressed:rotate-315"
                            y="7" width="9" height="2" rx="1"></rect>
                        <rect
                            class="origin-center transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.8)] group-aria-pressed:rotate-45"
                            y="7" width="16" height="2" rx="1"></rect>
                        <rect
                            class="origin-center translate-y-1.25 transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-pressed:translate-y-0 group-aria-pressed:rotate-135"
                            y="7" width="9" height="2" rx="1"></rect>
                    </svg>
                </button>
            </div>
            <h1 class="font-semibold text-center w-full text-xl">کوئرا لیست</h1>
        </nav>
    </header>
    <script src="/scripts/darkmode.js"></script>
</body>
</html>
